name: Build & Cache NixOS configurations
on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
concurrency:
  group: build-and-cache-${{ github.sha }}
  cancel-in-progress: true
jobs:
  generate_matrix:
    outputs:
      configs: ${{ steps.generate_matrix.outputs.configs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - id: generate_matrix
        run: |
          nix flake show --json > flake.json
          configs=$(jq -c ".nixosConfigurations | keys" < flake.json)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  build_configs:
    needs: generate_matrix
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate_matrix.outputs.configs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # - uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true
      - uses: cachix/install-nix-action@v31
      - name: Configure attic
        run: |
          nix profile add --impure --expr \
            "(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.$(uname -m)-linux.attic-client"
          attic login main https://cache.gorilla.gay "${{ secrets.ATTIC_TOKEN }}"
          attic use main
      - name: Build uncached derivations
        run: |
          if nix build \
            .#nixosConfigurations."${{ matrix.config }}".config.system.build.toplevel \
            --dry-run 2>&1 >/dev/null | tee dry_run_output.txt \
            | awk '
                /these [0-9]+ paths will be fetched/{exit}
                /these [0-9]+ derivations will be built/{next}
                {print}
            ' | grep '\.drv$' \
            | xargs grep -vlE '\\"preferLocalBuild\\":true|\("preferLocalBuild","1"\)' > build_drvs.txt; \
          then
            xargs nix-store --realise < build_drvs.txt
          else
            echo "Seemingly no derivations to be built; output from dry-run:"
            cat dry_run_output.txt
          fi

      - name: Push to attic
        run: |
          xargs nix-store --query --outputs < build_drvs.txt | attic push main --stdin
